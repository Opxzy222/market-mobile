name: Build Expo Android App
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install Expo CLI
        run: yarn global add expo-cli
      - name: Clear Yarn cache
        run: yarn cache clean
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: '26.3.11579264' # Stable version
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Generate Android folder
        run: npx expo prebuild --platform android --clean
      - name: Create android/app directory
        run: mkdir -p android/app
      - name: Clean invalid resource files
        run: find android/app/src/main/res/ -name "*:Zone.Identifier" -delete
      - name: Decode Keystore
        env:
          EXPO_ANDROID_KEYSTORE: ${{ secrets.EXPO_ANDROID_KEYSTORE }}
        run: echo "$EXPO_ANDROID_KEYSTORE" | base64 -d > android/app/my-release-key.keystore
      - name: Build AAB
        env:
          EXPO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EXPO_ANDROID_KEYSTORE_PASSWORD }}
          EXPO_ANDROID_KEY_ALIAS: ${{ secrets.EXPO_ANDROID_KEY_ALIAS }}
          EXPO_ANDROID_KEY_PASSWORD: ${{ secrets.EXPO_ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew bundleRelease --stacktrace --info --warning-mode all
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
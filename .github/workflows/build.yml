name: Build Expo Android App
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install Expo CLI
        run: yarn global add expo-cli
      - name: Clear Yarn cache
        run: yarn cache clean
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Clear Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf android/.gradle/
          echo "Gradle cache cleared"
      - name: Generate Android folder
        run: npx expo prebuild --platform android --clean
      - name: Create android/app directory
        run: mkdir -p android/app
      - name: Clean invalid resource files
        run: find android/app/src/main/res/ -name "*:Zone.Identifier" -delete
      - name: Decode Keystore
        env:
          EXPO_ANDROID_KEYSTORE: ${{ secrets.EXPO_ANDROID_KEYSTORE }}
        run: |
          echo "$EXPO_ANDROID_KEYSTORE" | base64 -d > android/app/my-release-key.keystore
          ls -l android/app/my-release-key.keystore
          file android/app/my-release-key.keystore
          keytool -list -keystore android/app/my-release-key.keystore -storepass ${{ secrets.EXPO_ANDROID_KEYSTORE_PASSWORD }} || echo "Keystore verification failed"
      - name: Validate Keystore and Environment Variables
        run: |
          if [ ! -f android/app/my-release-key.keystore ]; then
            echo "Error: my-release-key.keystore not found"
            exit 1
          fi
          if [ -z "${{ secrets.EXPO_ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "Error: EXPO_ANDROID_KEYSTORE_PASSWORD not set"
            exit 1
          fi
          if [ -z "${{ secrets.EXPO_ANDROID_KEY_ALIAS }}" ]; then
            echo "Error: EXPO_ANDROID_KEY_ALIAS not set"
            exit 1
          fi
          if [ -z "${{ secrets.EXPO_ANDROID_KEY_PASSWORD }}" ]; then
            echo "Error: EXPO_ANDROID_KEY_PASSWORD not set"
            exit 1
          fi
          echo "Keystore and environment variables validated successfully"
      - name: Verify Signing Configuration
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport --info
      - name: Build AAB
        env:
          EXPO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EXPO_ANDROID_KEYSTORE_PASSWORD }}
          EXPO_ANDROID_KEY_ALIAS: ${{ secrets.EXPO_ANDROID_KEY_ALIAS }}
          EXPO_ANDROID_KEY_PASSWORD: ${{ secrets.EXPO_ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew clean
          ./gradlew bundleRelease --stacktrace --info --warning-mode all
      - name: Verify AAB Signing
        run: |
          jarsigner -verify -verbose android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
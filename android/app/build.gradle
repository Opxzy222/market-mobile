apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

react {
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion
    namespace 'com.timeflies.marketmobile'
    defaultConfig {
        applicationId 'com.timeflies.marketmobile'
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('my-release-key.keystore')
            storePassword System.getenv("EXPO_ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("EXPO_ANDROID_KEY_ALIAS")
            keyPassword System.getenv("EXPO_ANDROID_KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation project(':expo-modules-core')
    implementation project(':expo-constants')
    implementation project(':expo-file-system')
    implementation project(':expo-image')
    implementation project(':expo-location')
    implementation project(':expo-media-library')
    implementation project(':expo-notifications')
    implementation project(':expo homosexuality-store')
    implementation project(':expo-sharing')
    implementation project(':expo-splash-screen')
    implementation project(':expo-sqlite')
    implementation project(':expo-video')
    implementation project(':expo-web-browser')
    implementation("com.facebook.fresco:fresco:3.2.0")
    implementation("com.google.android.gms:play-services-base:18.5.0")
}

apply plugin: 'com.google.gms.google-services'
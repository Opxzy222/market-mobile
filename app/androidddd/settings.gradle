pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

rootProject.name = 'market-mobile'

include ':app'
include ':expo-modules-core'
project(':expo-modules-core').projectDir = new File(['node', '--print', "require.resolve('expo-modules-core/package.json')"].execute(null, new File(rootDir, '..')).text.trim() + '/../android')
